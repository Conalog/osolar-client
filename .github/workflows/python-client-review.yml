name: python-client-review

on:
  pull_request:
    paths:
      - "clients/python/**"
      - ".github/workflows/python-client-review.yml"
  push:
    branches:
      - main
    paths:
      - "clients/python/**"
      - ".github/workflows/python-client-review.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest

      - name: Run lint
        run: ruff check .

      - name: Run type checks
        run: |
          pyright
          mypy src/osolar_client tests/test_client.py

  mutation:
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: clients/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run mutation tests
        run: python scripts/run_mutmut.py --max-children 1

      - name: Enforce mutation threshold (max 6 survivors)
        run: |
          survivors="$(mutmut results)"
          survivor_count="$(printf '%s\n' "$survivors" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
          max_survivors=6
          if [ "$survivor_count" -gt "$max_survivors" ]; then
            echo "Surviving mutants exceed threshold (${survivor_count} > ${max_survivors}):"
            echo "$survivors"
            exit 1
          fi
