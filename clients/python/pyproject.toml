[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "osolar_client"
version = "0.1.0"
description = "Handwritten Python client for OSOLAR-LINK Open API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "typing_extensions>=4.0.0; python_version < '3.11'"
]

[project.urls]
Repository = "https://github.com/Conalog/osolar-client"

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "mypy>=1.10.0",
  "mutmut>=3.4.0",
  "pyright>=1.1.400",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "twine>=5.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/osolar_client"]

[tool.hatch.build]
exclude = [
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/.venv313",
  "/dist",
  "/mutants",
]

[tool.pyright]
include = ["src/osolar_client", "tests", "examples"]
venvPath = "."
venv = ".venv"

[tool.mutmut]
paths_to_mutate = ["src/osolar_client/"]
tests_dir = ["tests/"]
mutate_only_covered_lines = true
