[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "osolar-client"
version = "0.1.0"
description = "Handwritten Python client for OSOLAR-LINK Open API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
