[package]
name = "osolar-client"
version = "0.1.0"
edition = "2021"
description = "Handwritten Rust client for OSOLAR-LINK Open API"
license = "MIT"

[dependencies]
reqwest = { version = "0.12.23", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
urlencoding = "2.1.3"

[dev-dependencies]
httpmock = "0.8.2"
